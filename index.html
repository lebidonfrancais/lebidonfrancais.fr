<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Bidon Français — Solutions professionnelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0B1E3D;
    --navy-light: #13294F;
    --steel: #4A5266;
    --steel-light: #7B8394;
    --line: #E4E6EA;
    --bg-soft: #F4F5F7;
    --white: #FFFFFF;
    --accent: #C9781F;
    --ink: #1A1D21;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',Arial,sans-serif;
    color:var(--ink);
    background:var(--white);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--navy);
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}

  .topbar{background:var(--navy);color:#AAB8D1;font-size:13px;}
  .topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding:9px 32px;flex-wrap:wrap;gap:6px;}
  .topbar strong{color:#fff;font-weight:500;}
  .topbar-links{display:flex;gap:22px;}

  nav{border-bottom:1px solid var(--line);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;flex-wrap:wrap;gap:16px;}
  .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;letter-spacing:-0.02em;color:var(--navy);}
  .navlinks{display:flex;gap:30px;font-size:14px;color:var(--steel);flex-wrap:wrap;}
  .navlinks a:hover{color:var(--navy);}
  .btn{
    display:inline-block;
    font-size:14px;
    font-weight:600;
    padding:11px 22px;
    border-radius:4px;
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-secondary{background:#fff;color:var(--ink);border-color:#C7CCD6;}

  .hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);align-items:stretch;}
